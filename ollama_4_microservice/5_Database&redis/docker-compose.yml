version: '3.8'

networks:
  ai-network:
    driver: bridge

volumes:
  postgres_data:

services:

  #postgresql
  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  #redis
  redis-server:
    image: "redis:alpine"
    env_file: .env
    networks:
      - ai-network

  # 新增 Audit 服務
  audit-service:
    build:
      context: .
      dockerfile: ./audit/Dockerfile
    env_file: .env
    networks:
      - ai-network
    # 不需要對外暴露 ports，因為只有內部服務會呼叫它

  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8081:8000"  #本機:docker
    depends_on:
      redis-server:
        condition: service_started
      audit-service:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - ai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-service:
    build: .
    command: python -m app.worker
    env_file: .env
    restart: always
    depends_on:
      - redis-server
      - db
    networks:
      - ai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"